
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Forward</title>
    <link rel="stylesheet" href="../css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body>

    <header>
        <h1 class="header__titulo font-title">Tab Forward</h1>
        <h2 class="header__objetivo font-text">Abra múltiplas abas com parâmetros dinâmicos</h2>
        <p class="header__resumo font-text">Configure um template de URL, defina os parâmetros e abra várias abas de uma vez.</p>
    </header>
    
    <main class="font-text">
        <div class="form-field">
            <label class="form-field__label" for="input_url">Template da URL</label>
            <input class="form-field__input input-style" id="input_url" name="url" type="text" placeholder="URL" required>
        </div>

        <div class="container">

            <p class="container__p">Parâmetros:</p>

            <form class="container__form" id="form">

                <div class="container__checkbox-field all-collumn">
                    <input class="container__input--checkbox" id="form_data_atual" name="data_atual" type="checkbox" value="true">
                    <label class="container__label--date" for="form_data_atual">Usar a data de hoje</label>
                </div>

                <div class="container__day-field label-input first-third">
                    <label class="container__label" for="form_dia">Dia</label>
                    <input class="container__input--number input-style" id="form_dia" name="dia" type="number" min="1" max="31">
                </div>
                
                <div class="container__month-field label-input second-third">
                    <label class="container__label" for="form_mes">Mês</label>
                    <input class="container__input--number input-style" id="form_mes" name="mes" type="number" min="1" max="12">
                </div>

                <div class="container__year-field label-input third-third">
                    <label class="container__label" for="form_ano">Ano</label>
                    <input class="container__input--number input-style" id="form_ano" name="ano" type="number" min="1500" max="2200">
                </div>

                <div class="container__direction-date-field label-input first-halve">
                    <label class="container__label" for="form_direcao_data">Direção</label>
                    <select class="container__select select--list input-style cursor-pointer" id="form_direcao_data" name="direcao_data" required>
                        <option class="container__option up" value="sobe">Subindo (próximos dias)</option>
                        <option class="container__option down" value="desce">Descendo (dias anteriores)</option>
                    </select>
                </div>

                <div class="container__step-date-field label-input second-halve">
                    <label class="container__label" for="form_passo_data">Pular de quantos em quantos dias</label>
                    <input class="container__input--number input-style" id="form_passo_data" name="passo_data" type="number" value="1" min="1">
                </div>

                <span class="container__hr all-collumn"></span>

                <div class="container__id-field label-input first-third">
                    <label class="container__label" for="form_id">ID</label>
                    <input class="container__input--number input-style" id="form_id" name="id" type="number" value="0">
                </div>

                <div class="container__direction-id-field label-input second-third">
                    <label class="container__label" for="form_direcao_id">Direção</label>
                    
                    <select class="container__select select--list input-style cursor-pointer" id="form_direcao_id" name="direcao_id">
                        <option class="container__option up" value="sobe">Subindo (próximos ids)</option>
                        <option class="container__option down" value="desce">Descendo (ids anteriores)</option>
                    </select>
                </div>

                <div class="container__step-id-field label-input third-third">
                    <label class="container__label" for="form_passo_id">Pular de quantos em quantos ids</label>
                    <input class="container__input--number input-style" id="form_passo_id" name="passo_id" type="number" value="1" min="1">
                </div>

                <span class="container__hr all-collumn"></span>
                
                <div class="container__amount-tabs-field label-input first-third">
                    <label class="container__label" for="form_qtde_abas">Quantidade de abas</label>
                    <input class="container__input--number input-style" id="form_qtde_abas" name="qtde_abas" type="number" value="1" min="1" max="30" required>
                </div>

                <div class="container__nav-option-field label-input second-third">
                    <label class="container__label label--nav" for="select_navegador">Escolha o navegador:
                        <span class="tooltip">
                        i
                        <span class="tooltip__texto">O navegador precisa estar instalado na sua máquina.</span>
                    </span>
                    </label>

                    <select class="container__select select--list input-style cursor-pointer" id="select_navegador" name="navegador">
                            <option class="container__option" value="chrome">Chrome</option>
                            <option class="container__option" value="edge">Edge</option>
                            <option class="container__option" value="firefox">Firefox</option>
                            <option class="container__option" value="opera">Opera</option>
                    </select>
                </div>

                <button class="acoes__button--add button third-third font-text cursor-pointer" id="button_add_parametros" type="button">Adicionar Parâmetro</button>
            </form>
        </div>

        <div class="acoes">
            <button class="acoes__button--view capturar button font-text cursor-pointer" id="button_pre_visualizar">Pré-visualizar URLs</button>
            <button class="acoes__button--exec capturar button font-text cursor-pointer" id="button_abrir_abas">Abrir abas</button>
            <button class="acoes__button--reset button material-symbols-outlined font-text cursor-pointer" id="button_limpar" type="reset">restart_alt</button>
        </div>

    </main>

    <script type="module" src="../js/index.js"></script>
</body>
</html>
